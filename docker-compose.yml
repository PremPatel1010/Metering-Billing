services:
  db: 
      image: postgres:16-alpine
      container_name: postgres_db
      restart: always
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: hello_world
         POSTGRES_DB:  billing_db
      ports:
       - "5432:5432"
      volumes: 
       - pgdata:/var/lib/postgresql/data


volumes:
 pgdata: